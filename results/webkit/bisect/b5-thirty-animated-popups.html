<!DOCTYPE html><!-- bisect of fast/scrolling/mac/event-dispatcher-timer-close-crash.html -->
<html>
<body>
<script>
let cycle = 0;
const maxCycles = 30;

function finish() {
    document.body.textContent = "PASS if no crash in the UI process during page close.";
}

function runCycle() {
    if (cycle++ >= maxCycles)
        return finish();

    let popup = window.open("about:blank", "", "width=200,height=200");
    if (!popup) {
        document.body.textContent = "POPUP-BLOCKED";
        return finish();
    }

    popup.document.body.innerHTML = "<div style=\"width:50px;height:50px;background:green;animation:s 10s linear infinite;will-change:transform\"></div><style>@keyframes s{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>";

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            popup.close();
            setTimeout(runCycle, 0);
        });
    });
}

runCycle();
</script>
</body>
</html>
