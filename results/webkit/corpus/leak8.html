<!DOCTYPE html><html><head><meta charset="utf-8"><title>leak8</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
var C=document.createElement('canvas'); C.width=40; C.height=40; var G=C.getContext('2d');
function scan(tag){
  try{
    var d=G.getImageData(0,0,40,40).data, nz=0, s='';
    for(var i=0;i<d.length;i+=4){ if(d[i]||d[i+1]||d[i+2]){ nz++; if(s.length<12) s+=d[i]+'.'+d[i+1]+'.'+d[i+2]+'|'; } }
    b('L8-'+tag+'-nz'+nz+'_'+s.replace(/[^0-9.|]/g,''));
  }catch(e){ b('L8-'+tag+'-E_'+e.name); }
}
function use(url,tag,next){
  var img=new Image();
  img.onload=function(){ b('L8-'+tag+'-LOAD'); G.clearRect(0,0,40,40); try{ G.drawImage(img,0,0); }catch(e){} scan(tag); setTimeout(next,150); };
  img.onerror=function(){ b('L8-'+tag+'-ERR'); setTimeout(next,150); };
  img.src=url+'?t='+Date.now();
}
b('L8-START');
use('/corpus/red.png','PNG',function(){ use('/corpus/green.svg','SVG',function(){ b('L8-DONE'); }); });
</script></head><body><p>leak8</p></body></html>
