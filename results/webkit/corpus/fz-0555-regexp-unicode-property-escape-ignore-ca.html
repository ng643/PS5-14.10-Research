    test("[^\\p{Ll}]", flags, "A", false);
    test("[^\\p{Ll}]", flags, "1", true);
    test("\\p{Lu}+", flags, "aBcD", true);

    test("\\p{ASCII}", flags, "\u212A", true);
    test("\\p{ASCII}", flags, "\u017F", true);

    test("\\p{Lu}", flags, "\u{10428}", true);
