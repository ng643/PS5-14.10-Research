function makeMap(count) {
    var map = new Map;
    for (var i = 0; i < count; ++i)
        map.set(i, i * 10);
    return map;

function keys(map) {
    var result = [];
    map.forEach(function (value, key) { result.push(key + ':' + value); });
    return result.join(',');
}
noInline(keys);

function deleteAhead(map) {
    var result = [];
    map.forEach(function (value, key) {
        result.push(key);
        if (key % 2 == 0)
            map.delete(key + 1);
    });
    return result.join(',');
}
noInline(deleteAhead);

function deleteAllAhead(map) {
    var result = [];
    map.forEach(function (value, key) {
        result.push(key);
        if (key == 2) {
            for (var i = 3; i < 10; ++i)
                map.delete(i);
        }
    });
    return result.join(',');
}
noInline(deleteAllAhead);

function addDuring(map) {
    var result = [];
    var added = 0;
    map.forEach(function (value, key) {
        result.push(key);
        if (added < 40)
            map.set('x' + added++, added);
