<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ws fuzz client</title></head>
<body><script>
// Walks tools/ws_fuzz_server.py cases: one connection per case, reconnect on close.
// Targets WebCore's WebSocket frame parser and its permessage-deflate inflater.

function beacon(tag) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon/' + encodeURIComponent(tag) + '?t=' + Date.now(), false);
    x.send(null);
  } catch (e) {}
}
function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

var URL_BASE = 'wss://manuals.playstation.net/ws';
var conn = 0, total = 0;

function once() {
  return new Promise(function(res) {
    var done = false, msgs = 0;
    function finish(tag) {
      if (done) return;
      done = true;
      beacon(tag + ' conn=' + conn);
      try { ws.close(); } catch (e) {}
      res();
    }
    var ws;
    try { ws = new WebSocket(URL_BASE + '?c=' + conn + '&t=' + Date.now()); } catch (e) { return finish('WS-CTOR-EXC ' + (e && e.name)); }
    ws.binaryType = 'arraybuffer';
    ws.onopen = function() { beacon('WS-OPEN conn=' + conn); };
    ws.onmessage = function(ev) {
      msgs++; total++;
      if ((msgs % 64) === 0) beacon('WS-MSG conn=' + conn + ' n=' + msgs);
    };
    ws.onerror = function() { finish('WS-ERR conn=' + conn + ' msgs=' + msgs); };
    ws.onclose = function(ev) { finish('WS-CLOSE conn=' + conn + ' code=' + ev.code + ' msgs=' + msgs); };
    setTimeout(function() { finish('WS-TIMEOUT conn=' + conn + ' msgs=' + msgs); }, 4000);
  });
}

async function run() {
  beacon('WS-START');
  for (conn = 0; conn < 400; conn++) {
    await once();
    if ((conn % 10) === 0) beacon('WS-PROGRESS conn=' + conn + ' msgs=' + total);
    await sleep(60);
  }
  beacon('WS-DONE conns=' + conn + ' msgs=' + total);
  location.replace('/corpus/poc-ws.html?t=' + Date.now());
}

run().catch(function(e) { beacon('WS-FATAL ' + (e && e.name) + ' ' + (e && e.message)); });
</script></body></html>
