<!doctype html><html><head><meta charset="utf-8"><title>p585</title>
<script>

var styleEl=null, firedHere=false, MAP=[], seen=[];

  for (var i=0;i<MAP.length;i++){
    var v=MAP[i], nz=0, first=-1;
    for (var o=0;o<SIZE;o++){
      if (o>=0x10 && o<=0x12) continue;
      if (v[o]) { nz++; if (first<0) first=o; }

  document.head.appendChild(styleEl);

  try { b('P585-PRECHECK-'+document.fonts.check('1em s0')); } catch(e){ b('P585-PRECHECK-THREW'); }
  b('P585-SETUP');

        MAP.push(v);

    },
    set:function(){}
  });

  document.fonts.load('1em f0, s0','AB').then(function(){ b('P585-RESOLVED'); },function(){ b('P585-REJECTED'); });
  setTimeout(function(){ scanAll('T90'); },90);
  setTimeout(function(){ scanAll('T300'); },300);
  setTimeout(function(){ scanAll('T900'); b('P585-END'); },900);
}
function run(){ b('P585-PARSE'); setup(); }
if (document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
