<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>mse</title></head>
<body><script>
// MSE appendBuffer fuzzer.
// SourceBufferPrivatePlayStation::appendInternal() forwards the bytes
// unchanged to mediaplayer::PSSourceBufferBackend::append(data, size), a
// closed sony demuxer that is not part of the open source drop. Every beacon
// is a synchronous GET so the last line in the server log names the last
// iteration that ran.

function beacon(tag) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/beacon/' + encodeURIComponent(tag) + '?t=' + Date.now(), false);
    x.send(null);
  } catch (e) {}
}

var seed = (Date.now() & 0x7fffffff) || 1;
function rnd() {
  seed ^= seed << 13; seed &= 0x7fffffff;
  seed ^= seed >>> 17;
  seed ^= seed << 5;  seed &= 0x7fffffff;
  return seed >>> 0;
}
function rndByte() { return rnd() & 0xff; }

// ---- MP4 box construction ------------------------------------------------
var te = new TextEncoder();
function u8(bytes) { return new Uint8Array(bytes); }
function u32(v) { return u8([(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255]); }
function u16(v) { return u8([(v >>> 8) & 255, v & 255]); }
function fourcc(s) {
  var b = [];
  for (var i = 0; i < 4; i++) b.push(s.charCodeAt(i) & 255);
  return u8(b);
}
function cat(parts) {
  var n = 0, i;
  for (i = 0; i < parts.length; i++) n += parts[i].length;
  var out = new Uint8Array(n), o = 0;
  for (i = 0; i < parts.length; i++) { out.set(parts[i], o); o += parts[i].length; }
  return out;
}
function box(type, parts, sizeOverride) {
  var body = cat(parts);
  var size = (sizeOverride === undefined) ? body.length + 8 : sizeOverride;
  return cat([u32(size), fourcc(type), body]);
}
function zeros(n) { return new Uint8Array(n); }

function initSegment(opts) {
  opts = opts || {};
  var width = opts.width || 640, height = opts.height || 360;
  var timescale = opts.timescale || 90000;
  var ftyp = box('ftyp', [fourcc('isom'), u32(0x200), fourcc('isom'), fourcc('iso6'), fourcc('mp41')]);
  var mvhd = box('mvhd', [u32(0), u32(0), u32(0), u32(timescale), u32(0), u32(0x00010000),
                          u16(0x0100), zeros(10), u32(0), u32(0), zeros(80)]);
  var tkhd = box('tkhd', [u32(3), u32(0), u32(0), u32(1), u32(0), u32(0),
                          u16(0), u16(0), u16(0), u16(0), zeros(8),
                          u16(0), u16(0), u16(0), u16(0), u32(width << 16), u32(height << 16)]);
  var mdhd = box('mdhd', [u32(0), u32(0), u32(0), u32(timescale), u32(0), u16(0x55c4), u16(0)]);
  var hdlr = box('hdlr', [u32(0), u32(0), fourcc('vide'), zeros(12), u8([0])]);
  var avcC = box('avcC', [u8([1, 0x42, 0xe0, 0x1e, 0xff, 0xe1]), u16(4), zeros(4), u8([1]), u16(0)]);
  var avc1 = box('avc1', [zeros(6), u16(1), zeros(16), u16(width), u16(height),
                          zeros(8), u16(1), zeros(32), u16(0x18), u16(0xffff), avcC]);
  var stsd = box('stsd', [u32(0), u32(1), avc1]);
  var stts = box('stts', [u32(0), u32(0)]);
  var stsc = box('stsc', [u32(0), u32(0)]);
  var stsz = box('stsz', [u32(0), u32(1000), u32(opts.sampleCount || 0)]);
  var stco = box('stco', [u32(0), u32(0)]);
  var stbl = box('stbl', [stsd, stts, stsc, stsz, stco]);
  var minf = box('minf', [box('vmhd', [u32(0), zeros(8)]), box('dinf', [box('dref', [u32(0), u32(0)])]), stbl]);
  var mdia = box('mdia', [mdhd, hdlr, minf]);
  var trak = box('trak', [tkhd, mdia]);
  var moov = box('moov', [mvhd, trak]);
  return cat([ftyp, moov]);
}

function mediaSegment(seq, samples) {
  var mfhd = box('mfhd', [u32(0), u32(seq)]);
  var tfhd = box('tfhd', [u32(0x020000), u32(1), u32(0), u32(0), u32(0)]);
  var parts = [u32(1), u32(0), u32(0), u32(0)];
  var payload = new Uint8Array(samples * 64);
  for (var i = 0; i < payload.length; i++) payload[i] = rndByte();
  for (var s = 0; s < samples; s++) {
    parts.push(u32(64)); parts.push(u32(0)); parts.push(u32(64));
  }
  var trun = box('trun', parts);
  var traf = box('traf', [tfhd, trun]);
  var moof = box('moof', [mfhd, traf]);
  return cat([moof, box('mdat', [payload])]);
}

// ---- mutation ------------------------------------------------------------
function mutate(buf) {
  var b = new Uint8Array(buf.length);
  b.set(buf);
  if (b.length < 16) return b;
  var k = rnd() % 6;
  if (k === 0) {                       // corrupt one dword anywhere
    var off = (rnd() % ((b.length - 4) >> 2)) << 2;
    var v = [0, 1, 0xffffffff, 0x7fffffff, 0x80000000, 0xfffffff0, 0x10000, 0xffff][rnd() % 8];
    b[off] = (v >>> 24) & 255; b[off + 1] = (v >>> 16) & 255;
    b[off + 2] = (v >>> 8) & 255; b[off + 3] = v & 255;
  } else if (k === 1) {                // corrupt a box size to an extreme
    var o = (rnd() % ((b.length - 8) >> 2)) << 2;
    var sv = [0, 1, 8, 0xffffffff, 0x7fffffff, b.length, b.length + 8, 0xffffff00][rnd() % 8];
    b[o] = (sv >>> 24) & 255; b[o + 1] = (sv >>> 16) & 255;
    b[o + 2] = (sv >>> 8) & 255; b[o + 3] = sv & 255;
  } else if (k === 2) {                // flip a fourcc to a sibling type
    var p = (rnd() % ((b.length - 8) >> 2)) << 2;
    var t = ['moov', 'trak', 'mdia', 'stbl', 'stsd', 'avc1', 'avcC', 'trun',
             'tfhd', 'traf', 'moof', 'mdat', 'stsz', 'stco', 'dref', 'free'][rnd() % 16];
    for (var i = 0; i < 4; i++) b[p + 4 + i] = t.charCodeAt(i) & 255;
  } else if (k === 3) {                // truncate
    b = b.slice(0, 8 + (rnd() % (b.length - 8)));
  } else if (k === 4) {                // duplicate a range
    var from = rnd() % b.length, len = 1 + (rnd() % Math.min(2048, b.length - from));
    var extra = new Uint8Array(b.length + len);
    extra.set(b, 0); extra.set(b.subarray(from, from + len), b.length);
    b = extra;
  } else {                             // random byte spray in the tail
    var n = 1 + (rnd() % 64);
    for (var j = 0; j < n; j++) b[b.length - 1 - (rnd() % Math.min(512, b.length))] = rndByte();
  }
  return b;
}

// ---- driver --------------------------------------------------------------
var mediaSource = null, sourceBuffer = null, video = null;
var appended = 0, iters = 0, errors = 0, stuck = 0, cycles = 0;

function freshSource() {
  cycles++;
  if (sourceBuffer) { try { sourceBuffer.abort(); } catch (e) {} }
  sourceBuffer = null;
  mediaSource = new MediaSource();
  video.src = URL.createObjectURL(mediaSource);
  mediaSource.addEventListener('sourceopen', function() {
    try {
      sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
      sourceBuffer.addEventListener('error', function() { errors++; });
      stuck = 0;
      beacon('MSE-OPEN cyc=' + cycles + ' it=' + iters);
    } catch (e) {
      beacon('MSE-SB-EXC ' + (e && e.name));
    }
  });
}

function nextBuffer() {
  iters++;
  var arm = iters % 5;
  if (arm === 0) return mediaSegment(iters, 1 + (rnd() % 8));
  if (arm === 1) return mutate(initBase);
  if (arm === 2) return mutate(mediaSegment(iters, 1 + (rnd() % 4)));
  if (arm === 3) {
    var n = [0, 1, 2, 7, 8, 9, 255, 256, 0x10000, 0x7fffffff][rnd() % 10];
    var raw = new Uint8Array(8 + (rnd() % 64));
    raw[0] = (n >>> 24) & 255; raw[1] = (n >>> 16) & 255;
    raw[2] = (n >>> 8) & 255; raw[3] = n & 255;
    for (var i = 4; i < raw.length; i++) raw[i] = rndByte();
    return raw;
  }
  var seg = mutate(mediaSegment(iters, 2));
  return seg.slice(0, 8 + (rnd() % Math.max(1, seg.length - 8)));
}

function run() {
  var init = initSegment({});
  initBase = init;
  beacon('MSE-INIT ' + init.length);
  setInterval(function() {
    if (iters >= 20000) return;
    if (!sourceBuffer || !mediaSource || mediaSource.readyState !== 'open') { stuck++; }
    else if (sourceBuffer.updating) { stuck++; }
    else {
      stuck = 0;
      var buf = nextBuffer();
      try { sourceBuffer.appendBuffer(buf); appended++; }
      catch (e) {
        errors++;
        if (errors % 100 === 1) beacon('MSE-EXC ' + (e && e.name) + ' it=' + iters);
      }
    }
    if (stuck > 60) { stuck = 0; freshSource(); }
    if (iters % 100 === 0 && iters > 0) {
      beacon('MSE-IT ' + iters + ' app=' + appended + ' err=' + errors + ' cyc=' + cycles);
    }
    if (iters >= 20000) {
      beacon('MSE-DONE it=' + iters + ' app=' + appended + ' err=' + errors);
      setTimeout(function() { location.reload(); }, 300);
    }
  }, 0);
}

var initBase = null;

try {
  beacon('MSE-START ' + (typeof MediaSource));
  if (typeof MediaSource !== 'undefined' && MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"')) {
    beacon('MSE-TYPE-OK');
    video = document.createElement('video');
    video.muted = true;
    document.body.appendChild(video);
    freshSource();
    run();
    setTimeout(function() { beacon('MSE-WAIT state=' + (mediaSource && mediaSource.readyState)); }, 2000);
  } else {
    beacon('MSE-TYPE-NO');
  }
} catch (e) {
  beacon('MSE-FATAL ' + (e && e.name));
}
</script></body></html>
