<!DOCTYPE html><html><head><meta charset="utf-8"><title>webp2</title><script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
var urls=['/corpus/anim63.webp','/corpus/webp-frame-exceeds-canvas.webp','/corpus/webp-anmf32-payload63.webp','/corpus/webp-plain63.webp'];
function tryOne(u){ return new Promise(function(res){ var i=new Image(); i.onload=function(){res(u.split('/').pop()+'-OK-'+i.naturalWidth+'x'+i.naturalHeight);}; i.onerror=function(){res(u.split('/').pop()+'-ERR');}; i.src=u+'?n='+Date.now(); }); }
function boot(){ b('W2-BOOT');
  tryOne(urls[0]).then(function(r){ b('W2-'+r);
    return tryOne(urls[1]).then(function(r2){ b('W2-'+r2);
      return tryOne(urls[2]).then(function(r3){ b('W2-'+r3);
        return tryOne(urls[3]).then(function(r4){ b('W2-'+r4); b('W2-DONE'); });
      });
    });
  });
}
window.addEventListener('load',boot);
</script></head><body><p>webp2</p></body></html>
