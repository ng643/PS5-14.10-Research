  function styleText(){

        if (r===0) el.textContent = pick(words) + pick(words);

  function fsync(tag){
    var u = location.origin + '/beacon/FZ-' + tag + '?t=' + Date.now();
    try { var x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); } catch(e){}

  var BATCH = 8;
  function run(){
    var k = 0;
    function one(){
      if (k >= BATCH) { try { location.replace('?s=' + (seed + BATCH)); } catch(e){} return; }
      var cur = seed + k; k++;
      reseed(cur);
      try { mark('S' + cur); } catch(e){}
