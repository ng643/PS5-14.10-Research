<script>

  var fam = 's'+U, nm = 'f'+U;

      styleEl = null;
      document.body.offsetHeight;

                                                     function(){ b('U50-OFF-'+OFF+'-REJECTED'); });
  setTimeout(function(){
    var hit=-1;

    b('U50-OFF-'+OFF+'-HIT-'+hit);

}
if (document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
