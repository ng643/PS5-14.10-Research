        var array = [42];
        shouldBe(shiftOnce(array), 42);
        shouldBe(array.length, 0);
    }
})();

// Length-1 Double fast path.
(function () {
    for (var i = 0; i < testLoopCount; ++i) {
        var array = [3.5];

        shouldBe(array.length, 0);

        shouldBe(array.length, 0);

        shouldBe(results.length, 4);

    for (var i = 0; i < testLoopCount; ++i) {
